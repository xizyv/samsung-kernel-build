name: Build Test Kernel A32
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make libc6-dev \
            libncurses5-dev zip cpio python3 perl lzop libelf-dev dwarves \
            git wget curl gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone kernel
        run: |
          git clone --depth=1 https://github.com/stardustps/kernel_samsung_mt6768-lucreticus.git kernel
          ls kernel/arch/arm64/configs/ | grep -i -E "a32|a325|mt6768"

      - name: Clone Proton Clang 13
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang
          clang/bin/clang --version

      - name: Build
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH

          DEFCONFIG=$(ls arch/arm64/configs/ | grep -i -E "^a32.*defconfig" | head -n1)
          echo "Using defconfig: $DEFCONFIG"

          make O=out $DEFCONFIG \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu-

          make O=out -j$(nproc) \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            2>&1 | tee build.log

      - name: Pack Artifacts
        run: |
          mkdir -p kernel/output
          cd kernel/out/arch/arm64/boot
          for f in Image.gz-dtb Image.gz Image dtbo.img; do
            [ -f "$f" ] && cp "$f" ../../../../output/ || true
          done
          ls -la ../../../../output/

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Lucretius-A32
          path: kernel/output/

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel/build.log
